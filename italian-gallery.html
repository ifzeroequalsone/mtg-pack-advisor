<style>

  --fg3: #9b9080;

  --card-bg: #ffffff;

  --shadow-hover: 0 8px 32px rgba(0,0,0,0.18);
  --accent: #7a4f28;
  --accent2: #c4873a;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #12100d; --bg2: #1c1a16; --fg: #ede8df; --fg2: #9b9080;
    --fg3: #6b6558; --border: #2e2b24; --card-bg: #1c1a16;
    --shadow: 0 2px 16px rgba(0,0,0,0.5); --shadow-hover: 0 8px 36px rgba(0,0,0,0.7);
    --accent: #c4873a; --accent2: #e8b06a; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #12100d; --bg2: #1c1a16; --fg: #ede8df; --fg2: #9b9080;
  --fg3: #6b6558; --border: #2e2b24; --card-bg: #1c1a16;
  --shadow: 0 2px 16px rgba(0,0,0,0.5); --shadow-hover: 0 8px 36px rgba(0,0,0,0.7);
  --accent: #c4873a; --accent2: #e8b06a; color-scheme: dark;
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: 'Inter', system-ui, sans-serif;
  background: var(--bg);
  color: var(--fg);
  padding-block: 40px 64px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  min-height: 100%;
}

header {
  text-align: center;
  margin-bottom: 36px;
}
header h1 {
  font-family: 'Cinzel', Georgia, serif;
  font-size: clamp(1.5rem, 4vw, 2.4rem);
  font-weight: 600;
  color: var(--accent);
  letter-spacing: 0.06em;
  margin-bottom: 6px;
}
header p {
  font-size: 0.85rem;
  color: var(--fg2);
}
.count-badge {
  display: inline-block;
  background: var(--bg2);
  border: 1px solid var(--border);
  border-radius: 20px;
  padding: 3px 12px;
  font-size: 0.75rem;
  color: var(--fg2);
  margin-top: 10px;
}

.search-row {
  display: flex; justify-content: center; gap: 10px; margin-bottom: 32px; flex-wrap: wrap;
}
#searchBox {
  width: min(400px, 100%);
  background: var(--card-bg);
  border: 1px solid var(--border);
  border-radius: 8px;
  color: var(--fg);
  font-family: 'Inter', sans-serif;
  font-size: 0.88rem;
  padding: 9px 14px;
  outline: none;
  transition: border-color 0.15s;
}
#searchBox:focus { border-color: var(--accent2); }
#searchBox::placeholder { color: var(--fg3); }

.grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
  gap: 20px;
  max-width: 1300px;
  margin: 0 auto;
}

.card {
  background: var(--card-bg);
  border: 1px solid var(--border);
  border-radius: 12px;
  overflow: hidden;
  box-shadow: var(--shadow);
  transition: transform 0.2s, box-shadow 0.2s;
  cursor: default;
}
.card:hover {
  transform: translateY(-4px);
  box-shadow: var(--shadow-hover);
}
.card img {
  width: 100%;
  display: block;
  border-radius: 10px 10px 0 0;
  aspect-ratio: 488/680;
  object-fit: cover;
  background: var(--bg2);
}
.card-info {
  padding: 10px 12px 12px;
  border-top: 1px solid var(--border);
}
.card-italian {
  font-family: 'Cinzel', Georgia, serif;
  font-size: 0.75rem;
  font-weight: 600;
  color: var(--accent);
  line-height: 1.3;
  margin-bottom: 3px;
  text-wrap: balance;
}
.card-english {
  font-size: 0.68rem;
  color: var(--fg3);
  font-style: italic;
  line-height: 1.3;
}

.no-results {
  text-align: center;
  color: var(--fg2);
  font-size: 0.9rem;
  padding: 60px 0;
  grid-column: 1 / -1;
}

@media (max-width: 480px) {
  .grid { grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 12px; }
  .card-italian { font-size: 0.68rem; }
}
@media (prefers-reduced-motion: reduce) {
  .card { transition: none; }
}
</style>

];

function render(list) {
  const grid = document.getElementById('grid');
  document.getElementById('countBadge').textContent = list.length + ' carte';
  if (!list.length) {
    grid.innerHTML = '<div class="no-results">Nessuna carta trovata.</div>';
    return;
  }
  grid.innerHTML = list.map(c => `
    <div class="card">
      <img src="${c.u}" alt="${c.i}" loading="lazy">
      <div class="card-info">
        <div class="card-italian">${c.i}</div>
        <div class="card-english">${c.e}</div>
      </div>
    </div>`).join('');
}

function filterCards() {
  const q = document.getElementById('searchBox').value.trim().toLowerCase();
  render(q ? CARDS.filter(c => c.i.toLowerCase().includes(q) || c.e.toLowerCase().includes(q)) : CARDS);
}

render(CARDS);
</script>
